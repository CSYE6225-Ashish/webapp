name: Packer fmt and validate CI

on:
  pull_request:
    branches: [main]

jobs:
  packer-check:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_INSTANCE_TYPE: ${{ secrets.AWS_INSTANCE_TYPE }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SOURCE_AMI: ${{ secrets.SOURCE_AMI }}
      AMI_NAME_PREFIX: ${{ secrets.AMI_NAME_PREFIX }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}

      

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Create dev.pkvars.hcl
        working-directory: packer
        run: |
          echo "aws_region       = \"${{ env.AWS_REGION }}\"" > dev.pkvars.hcl
          echo "aws_instance_type = \"${{ env.AWS_INSTANCE_TYPE }}\"" >> dev.pkvars.hcl
          echo "aws_access_key   = \"${{ env.AWS_ACCESS_KEY }}\"" >> dev.pkvars.hcl
          echo "aws_secret_key   = \"${{ env.AWS_SECRET_ACCESS_KEY }}\"" >> dev.pkvars.hcl
          echo "source_ami       = \"${{ env.SOURCE_AMI }}\"" >> dev.pkvars.hcl
          echo "ami_name_prefix  = \"${{ env.AMI_NAME_PREFIX }}\"" >> dev.pkvars.hcl
          echo "db_name          = \"${{ env.DB_NAME }}\"" >> dev.pkvars.hcl
          echo "db_user          = \"${{ env.DB_USERNAME }}\"" >> dev.pkvars.hcl
          echo "db_password      = \"${{ env.DB_PASSWORD }}\"" >> dev.pkvars.hcl
          echo "db_host          = \"${{ env.DB_HOST }}\"" >> dev.pkvars.hcl
          echo "dev_user         = \"${{ env.DEV_USER }}\"" >> dev.pkvars.hcl

      - name: Create gcpsecrets.json
        working-directory: packer
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" > gcpsecrets.json
        



      - name: Set up Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: '1.12.0'

     

      - name: Check Packer format
        working-directory: ./packer
        run: |
          packer fmt -check webapp-image.pkr.hcl

      - name: Create webapp.zip from existing directory
        run: |
          sudo apt-get update -y
          sudo npm install
          sudo apt-get install -y unzip
          zip -r webapp.zip .env .
          cp -r webapp.zip packer
        shell: bash

      - name: Initialize Packer template
        working-directory: ./packer
        run: |
          packer init .
      

      - name: Validate Packer template
        env:
          GCP_CREDENTIALS_FILE: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        working-directory: ./packer
        run: |
          packer validate --var-file=dev.pkvars.hcl --var "gcp_credentials_json=${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}"  webapp-image.pkr.hcl
