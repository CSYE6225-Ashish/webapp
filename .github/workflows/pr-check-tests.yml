name: pr-check-test
 
on:
  pull_request:
    branches:
      - main
 
jobs:
  setup-mysql-and-performing-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Environment Variables for Tests
        run: |
          echo "DB_USERNAME= ${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD= ${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST= ${{ secrets.DB_HOST }}" >> .env
          echo "ENV = ${{ secrets.DB_ENV }}" >> .env
          echo "DB_NAME_TEST=${{secrets.DB_NAME_TEST}}" >> .env


      - name: Enable mysql service
        run: sudo systemctl start mysql
 
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
 
      - name: Install Dependencies
        run: |
          npm install
 
      - name: Wait for MySQL to be Ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Initialize MySQL Database as Root
        run: |
          sudo mysql -u${{secrets.DB_USER_ROOT}} -${{ secrets.DB_ROOT_PASSWORD }}<<EOF
          CREATE DATABASE IF NOT EXISTS \`${{secrets.DB_NAME_TEST}}\`;
          CREATE USER IF NOT EXISTS '${{ secrets.DB_USERNAME }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON \`${{secrets.DB_NAME_TEST}}\`.* TO '${{ secrets.DB_USER }}'@'%';
          EOF
 
      
      - name: Run Tests
        run: |
          npm test
 
 