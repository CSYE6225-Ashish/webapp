name: pr-check-test
 
on:
  pull_request:
    branches:
      - main
 
jobs:
  setup-mysql-and-performing-tests:
    runs-on: ubuntu-latest
 
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME_TEST }}
          MYSQL_USER: ${{ secrets.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
 
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
 
      - name: Install Dependencies
        run: |
          npm install
 
      - name: Wait for MySQL to be Ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
 
      
      - name: Initialize MySQL Database as Root
        run: |
          mysql -h 127.0.0.1 -uroot -p${{ secrets.DB_ROOT_PASSWORD }} <<EOF
          CREATE DATABASE IF NOT EXISTS \`${{ secrets.DB_NAME_TEST }}\`;
          CREATE USER IF NOT EXISTS '${{ secrets.DB_USER }}'@'127.0.0.1' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON \`${{ secrets.DB_NAME_TEST }}\`.* TO '${{ secrets.DB_USER }}'@'127.0.0.1';
          ALTER USER '${{ secrets.DB_USER }}'@'127.0.0.1' IDENTIFIED WITH mysql_native_password BY '${{ secrets.DB_PASSWORD }}';
          FLUSH PRIVILEGES;
          EOF
 
      - name: Set Environment Variables for Tests
        run: |
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_NAME_TEST=${{secrets.DB_NAME_TEST}}" >> .env
 
      - name: Run Tests
        run: |
          npm test
 
 