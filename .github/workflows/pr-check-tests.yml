name: pr-check-test
 
on:
  pull_request:
    branches:
      - main
 
jobs:
  setup-mysql-and-performing-tests:
    runs-on: ubuntu-latest


 
   
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Environment Variables for Tests
        run: |
          echo "DB_USERNAME= root" >> .env
          echo "DB_PASSWORD= root" >> .env
          echo "DB_HOST= 127.0.0.1" >> .env
          echo "DB_NAME_TEST=${{secrets.DB_NAME_TEST}}" >> .env


      - name: Enable mysql service
        run: sudo systemctl start mysql
 
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
 
      - name: Install Dependencies
        run: |
          npm install
 
      - name: Wait for MySQL to be Ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done


      
      
  
      
      - name: Initialize MySQL Database as Root
        run: |
          sudo mysql -uroot -proot<<EOF
          CREATE DATABASE IF NOT EXISTS \`health_check_db\`;
          CREATE USER IF NOT EXISTS '${{ secrets.DB_USER }}'@'%' IDENTIFIED BY '${{ secrets.DB_PASSWORD }}';
          GRANT ALL PRIVILEGES ON \`health_check_db\`.* TO '${{ secrets.DB_USER }}'@'%';
          ALTER USER '${{ secrets.DB_USER }}'@'%' IDENTIFIED WITH mysql_native_password BY '${{ secrets.DB_PASSWORD }}';
          FLUSH PRIVILEGES;
          EOF
 
      
      - name: Run Tests
        run: |
          npm test
 
 